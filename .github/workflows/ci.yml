name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same ref so a fast follow-up commit
# doesn't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS only — that's the only platform we ship to. cargo + git2 +
    # keyring all behave differently on Linux/Windows; running CI on the
    # ship target gives the most signal.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Keep the CI cache separate from any release-job cache.
          shared-key: 'ci'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Frontend type-check (svelte-kit + svelte-check)
        run: pnpm check

      - name: Rust check (src-tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Tests (vitest)
        run: pnpm test
