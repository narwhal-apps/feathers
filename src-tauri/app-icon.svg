<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card surface — warm cream paper, top-lit. -->
    <linearGradient id="cardFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#f0ebe2"/>
    </linearGradient>
    <!-- Vane fill — teal gradient deepening toward the base. -->
    <linearGradient id="vaneFill" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#99f6e4"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1"   stop-color="#14b8a6"/>
    </linearGradient>
    <!-- Card drop shadow + top highlight. -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="cardHi" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!--
    macOS Big Sur+ icon spec: a 824×824 squircle centered in a 1024×1024
    canvas (100px transparent padding on each side). The padding lets the
    drop shadow breathe AND keeps Feathers visually flush with native
    macOS apps in the Dock — without it the icon reads ~15% too large.
    Corner radius 22.37% × 824 ≈ 184 (Big Sur squircle ratio).
  -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#cardFill)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#cardHi)" pointer-events="none"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="183.5"
        fill="none" stroke="#d8d3cb" stroke-width="1.5"/>

  <!--
    Lucide feather (CC BY-ISC), scaled 25× from its 24-unit viewBox to
    ~600×600 and centered in the 1024 canvas (212px translate). With
    stroke-width 1.0 inside the scaled group the rendered stroke is 25px
    — bold enough to hold up at 32×32 in the menu bar.
  -->
  <g
    transform="translate(212 212) scale(25)"
    fill="none"
    stroke="#15201f"
    stroke-width="1.0"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Closed feather body — filled in teal so it reads as a SHAPE. -->
    <path
      d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"
      fill="url(#vaneFill)"
    />
    <!-- Diagonal rachis (spine). -->
    <path d="M16 8 2 22"/>
    <!-- Vane separator. -->
    <path d="M17.5 15H9"/>
  </g>
</svg>
