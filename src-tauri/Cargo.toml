[package]
name = "feathers-app"
version = "0.1.2"
description = "A Git desktop app"
authors = ["Mikael Kristiansson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "feathers_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Override the default binary name (which comes from `package.name` =
# "feathers-app") so the macOS Dock tooltip in dev shows "Feathers"
# instead of "feathers-app". Production .app bundles use `productName`
# from tauri.conf.json — this only affects the dev binary filename.
[[bin]]
name = "Feathers"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
    "vendored-openssl",
    "ssh",
    "https",
] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify-debouncer-mini = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }
keyring = { version = "3", features = ["apple-native"] }
home = "0.5.12"

[dev-dependencies]
tempfile = "3"
